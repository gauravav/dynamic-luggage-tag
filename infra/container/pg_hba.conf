# Dynamic Luggage Tag — client authentication policy.
#
# TYPE      DATABASE  USER  ADDRESS       METHOD
#
# Unix socket inside the container only. The official entrypoint needs this to
# run initdb and set the superuser password; it is not reachable off-host.
local       all       all                 trust

# Every TCP connection must be TLS and must use SCRAM-SHA-256.
hostssl     all       all   0.0.0.0/0     scram-sha-256
hostssl     all       all   ::/0          scram-sha-256

# Plaintext TCP is refused outright rather than silently downgraded.
hostnossl   all       all   0.0.0.0/0     reject
hostnossl   all       all   ::/0          reject
