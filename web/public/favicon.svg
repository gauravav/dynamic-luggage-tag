<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dynamic Luggage Tag">
  <!--
    A luggage tag on a dark field, with the diagonal weave the app's own
    designs are built from. The same two marks as the header's brand square,
    at a size where only two marks survive: the tag's silhouette, and the
    pattern that is the whole point of it.
  -->
  <title>Dynamic Luggage Tag</title>
  <rect width="64" height="64" rx="14" fill="#1F4034"/>
  <g>
    <clipPath id="tag">
      <rect x="14" y="8" width="36" height="48" rx="7"/>
    </clipPath>
    <rect x="14" y="8" width="36" height="48" rx="7" fill="#FAF6EC"/>
    <g clip-path="url(#tag)">
      <path d="M9 41 L39 5 M21 53 L51 17 M33 65 L63 29" stroke="#2F5D4E" stroke-width="5" fill="none"/>
      <path d="M15 53 L45 17" stroke="#8C6221" stroke-width="5" fill="none"/>
    </g>
    <circle cx="32" cy="17" r="3.6" fill="#1F4034"/>
  </g>
</svg>
