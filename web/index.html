<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the bottom tab bar extend under the home indicator,
         padded back out with env(safe-area-inset-bottom). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      The Content-Security-Policy is delivered as a response header, not a
      <meta> tag — see the csp() plugin in vite.config.ts and the production
      snippet in docs/self-hosting.md. A meta policy silently ignores
      frame-ancestors, and it is applied mid-parse, which blocks the inline
      module preamble Vite injects during development.
    -->
    <meta name="referrer" content="no-referrer" />
    <!-- Scan pages carry a token in the URL; keep them out of search indexes. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FAF6EC" />

    <!--
      %BASE_URL% is Vite's configured base, substituted at build time. A
      relative href would break the moment a deep route like
      /app/tags/<id> is served this same index.html, because the browser
      would resolve the icon against that path instead of the app root.
    -->
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <title>Dynamic Luggage Tag</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
